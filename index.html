<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birthday Invitation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Georgia,serif;background:radial-gradient(circle,#fff8f3,#efd7ce 65%,#d8b7a9);display:grid;place-items:center;color:#6b4437}
#intro{text-align:center;transition:.6s}
#intro.hide{opacity:0;transform:scale(.8);pointer-events:none;position:absolute}
.small{font-size:14px;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}
.env{width:min(82vw,360px);height:min(55vw,240px);position:relative;cursor:pointer;filter:drop-shadow(0 15px 20px #60402f33)}
.b,.f,.flap{position:absolute;inset:0;border-radius:8px}
.b{background:linear-gradient(145deg,#f8ddd5,#e8b9ad)}
.f{background:#edc5bb;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%)}
.flap{height:65%;background:linear-gradient(160deg,#f9e5df,#e4b0a5);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:1s;z-index:4}
.seal{position:absolute;left:50%;top:53%;transform:translate(-50%,-50%);z-index:6;width:58px;height:58px;border-radius:50%;background:#c99968;color:#fff;display:grid;place-items:center;font-size:25px;transition:.3s}
.env.open .flap{transform:rotateX(180deg);z-index:1}
.env.open .seal{opacity:0}
.tap{margin-top:18px;animation:p 1.5s infinite}
@keyframes p{50%{transform:scale(1.04);opacity:.65}}
#wrap{position:absolute;width:min(92vw,560px);height:92vh;opacity:0;transform:translateY(50px) scale(.85);transition:1s;pointer-events:none}
#wrap.show{opacity:1;transform:none;pointer-events:auto}
.card{height:auto;max-height:92vh;overflow:auto;border-radius:18px;background:#fff;box-shadow:0 25px 60px #50302755;scrollbar-width:none;position:relative}
.card::-webkit-scrollbar{display:none}
.card img{display:block;width:100%;height:auto}
.forname{position:absolute;left:39.5%;top:63.0%;width:49%;text-align:center;font-size:24px;font-weight:800;color:#b24f6f;line-height:1;text-transform:uppercase;white-space:nowrap;transform-origin:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
@media(max-width:400px){.forname{font-size:19px}}
#replay{position:fixed;right:14px;top:14px;display:none;border:0;border-radius:30px;padding:10px 14px;background:#fff7f2dd;color:#704b40;z-index:9}
#replay.show{display:block}
</style>
</head>

<div class="small">A special invitation awaits you</div>

</div>

<script>
const params=new URLSearchParams(location.search);
const name=(params.get('for')||'').trim().toUpperCase();
const nameEl=document.getElementById('forname');
nameEl.textContent=name;
function fitName(){
  if(!name) return;
  let size=24;
  nameEl.style.fontSize=size+'px';
  while(nameEl.scrollWidth > nameEl.clientWidth && size > 10){
    size-=0.5;
    nameEl.style.fontSize=size+'px';
  }
}
window.addEventListener('load',fitName);
window.addEventListener('resize',fitName);
const e=document.querySelector('#env'),i=document.querySelector('#intro'),w=document.querySelector('#wrap'),r=document.querySelector('#replay');
e.onclick=()=>{e.classList.add('open');setTimeout(()=>{i.classList.add('hide');w.classList.add('show');r.classList.add('show')},850)};
r.onclick=()=>{w.classList.remove('show');r.classList.remove('show');setTimeout(()=>{i.classList.remove('hide');e.classList.remove('open')},400)};
</script>
